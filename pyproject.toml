[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tybuild"
version = "0.1.0"
requires-python = ">=3.6"

[project.scripts]
tybuild = "tybuild.cli:main"

# ONE_CHECK.vcxproj is a data file, not a module, so it is not picked up by
# package discovery. Without this it survives an editable install (which resolves
# to the source tree) but is silently missing from a regular one.
[tool.setuptools.package-data]
tybuild = ["templates/*.vcxproj"]
